[package]
# NOTE: the crate name is load-bearing — .github/workflows/desktop-publish.yml
# stages the Windows portable build from target/release/app.exe, a path derived
# from this name. Renaming it silently breaks that workflow step.
name = "app"
version = "0.1.0"
description = "Akaun — personal bookkeeping and expense tracking, as a desktop app"
authors = ["Akaun contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/akaun-app/akaun"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
rand = "0.8"
ureq = "2"
