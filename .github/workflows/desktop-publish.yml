name: Desktop Publish

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
  workflow_dispatch:

jobs:
  build-macos-dmg:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run test:unit --run --project=server

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.json.tmp
          mv src-tauri/tauri.conf.json.tmp src-tauri/tauri.conf.json

      - run: bash scripts/build-desktop-dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: akaun-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/dmg/*.dmg
